name: Release QuickClip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build and Sign with Tauri CLI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: true
        run: npx tauri build --ci

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "upload" -Force | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.*" | Copy-Item -Destination "upload" -Force
          
          # Generate latest.json updater manifest
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          $sigPath = "src-tauri/target/release/bundle/nsis/quickclip_${ver}_x64-setup.exe.sig"
          if (Test-Path $sigPath) {
              $sig = (Get-Content -Raw $sigPath).Trim()
              $latestJson = @{
                  version = $ver
                  notes = "QuickClip $tag release"
                  pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                  platforms = @{
                      "windows-x86_64" = @{
                          signature = $sig
                          url = "https://github.com/${{ github.repository }}/releases/download/$tag/quickclip_${ver}_x64-setup.exe"
                      }
                      "windows-x86_64-nsis" = @{
                          signature = $sig
                          url = "https://github.com/${{ github.repository }}/releases/download/$tag/quickclip_${ver}_x64-setup.exe"
                      }
                  }
              } | ConvertTo-Json -Depth 5
              Set-Content -Path "upload/latest.json" -Value $latestJson -Force
          }
          Get-ChildItem upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QuickClip ${{ github.ref_name }}
          body: 'QuickClip for Windows - Download the setup installer or update directly in-app.'
          draft: false
          prerelease: false
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
